name: Trivy scan
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images from compose
        run: docker compose build
      - name: Trivy scan backend
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --severity CRITICAL,HIGH --exit-code 0 lab-backend
      - name: Trivy scan frontend
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --severity CRITICAL,HIGH --exit-code 0 lab-frontend

<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Lab</title></head>
<body>
  <h1>Фронтенд</h1>
  <p id="out">Загрузка...</p>
  <script>
    fetch("/api/hello")
      .then(r => r.json())
      .then(d => document.getElementById("out").textContent = d.message)
      .catch(e => document.getElementById("out").textContent = "Ошибка: " + e);
  </script>
</body>
</html>
